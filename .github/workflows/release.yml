name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.2.0
        required: true

env:
  NDK_VERSION: 27.3.13750724

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: gradle/actions/wrapper-validation@v4

      - name: Derive the version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${TAG#v}"
          # versionCode has to increase monotonically or Android refuses the upgrade. The tag
          # count is monotonic and needs no state kept anywhere. The +1 puts the first public
          # tag at 2, matching the default in app/build.gradle.kts and leaving 1 to the
          # debug-signed builds that predate any release.
          CODE=$(( $(git tag --list 'v*' | wc -l) + 1 ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Rust and the Android targets
        run: rustup show
        working-directory: core

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;${{ env.NDK_VERSION }}"

      # A release that ships untested is the thing this pipeline exists to prevent.
      - name: Rust tests
        run: cargo test
        working-directory: core

      - name: Kotlin unit tests and lint
        run: ./gradlew testDebugUnitTest lint

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. A release must not ship debug-signed:"
            echo "::error::the debug key is generated per machine, so nothing can upgrade it."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the release APKs
        env:
          OMNISHIELD_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OMNISHIELD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OMNISHIELD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OMNISHIELD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          OMNISHIELD_VERSION_NAME: ${{ steps.version.outputs.name }}
          OMNISHIELD_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease

      - name: Name the artifacts and checksum them
        id: package
        run: |
          V="${{ steps.version.outputs.name }}"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/omnishield-$V-$abi.apk"
          done
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS

      # Proves the signature is the release key, not the Android debug certificate. A
      # debug-signed release would install fine and then be unupgradeable forever.
      - name: Verify the signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" | grep -q "Android Debug" \
              && { echo "::error::$apk is debug-signed"; exit 1; }
            echo "ok: $apk"
          done

      - name: Extract the changelog section
        id: notes
        run: |
          V="${{ steps.version.outputs.name }}"
          awk -v v="$V" '
            $0 ~ "^## \\[?"v"\\]?" {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for $V." > notes.md
          fi
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OmniShield ${{ steps.version.outputs.name }}
          body_path: notes.md
          files: |
            dist/*.apk
            dist/SHA256SUMS
