[package]
name = "omnishield_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false

# Standalone workspace — this crate is not part of any parent Cargo workspace.
[workspace]

[lib]
name = "omnishield_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
log = "0.4"
libc = "0.2"
smoltcp = "0.13"
# `rc` lets Arc<str> serialize as a plain string, which is what allows the hot
# event fields to be refcounted instead of reallocated per event.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Phase 4 — TLS interception. `ring` is the backend that cross-compiles cleanly to
# aarch64-linux-android under cargo-ndk; aws-lc-rs needs a full CMake/Go toolchain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }

# Phase 5 — content filtering. Brave's engine implements full ABP network + cosmetic syntax;
# hand-rolling that parser would be both large and subtly wrong.
# `single-thread` is in the crate's own defaults and would drop some atomic refcounting, but it
# swaps Arc for Rc inside the Engine, which makes it !Send — and `Shared` is held in an Arc that
# the tunnel thread and every JNI caller share. Tried and reverted, not overlooked.
# `full-regex-handling` is kept: dropping it would silently weaken rule coverage.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
lol_html = "3"
httparse = "1"
flate2 = "1"
lru = "0.18"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
# No unwinding. A panic cannot usefully cross the JNI boundary anyway, and the alternative is
# worse than a crash: an unwind kills only the tunnel thread, leaving VpnService holding a TUN
# nothing is servicing, so every app on the device silently loses connectivity with no error
# anywhere. Aborting takes the process down, START_STICKY brings it back, and the tunnel
# re-establishes. It also drops the unwind tables from the shipped .so.
panic = "abort"
